name: dartitect_sentry
description: Consumer-owned Sentry adapters for Dartitect logs, errors, and tracing.
version: 1.2.0
publish_to: none
repository: https://github.com/ftr-tuta/dartitect
issue_tracker: https://github.com/ftr-tuta/dartitect/issues
topics: [sentry, observability, tracing, architecture]
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  dartitect_observability:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_observability
      tag_pattern: 'v{{version}}'
    version: 1.2.0
  sentry: ^9.27.0

dev_dependencies:
  test: ^1.26.3
