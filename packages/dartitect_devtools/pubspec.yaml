name: dartitect_devtools
description: Optional read-only DevTools service extensions for Dartitect diagnostics.
version: 1.1.0-rc.1
publish_to: none
repository: https://github.com/ftr-tuta/dartitect
issue_tracker: https://github.com/ftr-tuta/dartitect/issues
topics: [devtools, diagnostics, observability, dart]
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  dartitect:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.1
  dartitect_observability:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_observability
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.1
dev_dependencies:
  test: ^1.26.3
