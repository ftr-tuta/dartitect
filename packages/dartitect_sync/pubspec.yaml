name: dartitect_sync
description: Provider-neutral datasets, checkpoints, leases, and headless sync orchestration for Dart.
version: 1.1.0-rc.2
publish_to: none
repository: https://github.com/ftr-tuta/dartitect
issue_tracker: https://github.com/ftr-tuta/dartitect/issues
topics: [sync, offline-first, architecture, dart]
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  dartitect:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.2
  dartitect_jobs:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_jobs
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.2
  dartitect_resilience:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_resilience
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.2
dev_dependencies:
  test: ^1.26.3
