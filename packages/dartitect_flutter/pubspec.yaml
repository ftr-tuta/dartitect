name: dartitect_flutter
description: Native Flutter lifecycle, command, selector, and scope primitives for Dartitect.
version: 1.1.0-rc.2
publish_to: none
repository: https://github.com/ftr-tuta/dartitect
issue_tracker: https://github.com/ftr-tuta/dartitect/issues
topics: [architecture, flutter, mvvm, lifecycle]
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.1'

dependencies:
  dartitect:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.2
  flutter:
    sdk: flutter

dev_dependencies:
  dartitect_observability:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_observability
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.2
  flutter_test:
    sdk: flutter
