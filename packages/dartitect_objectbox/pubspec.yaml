name: dartitect_objectbox
description: Optional explicit Store and observation lifecycle integration for ObjectBox.
version: 1.0.0
publish_to: none
repository: https://github.com/ftr-tuta/dartitect
issue_tracker: https://github.com/ftr-tuta/dartitect/issues
topics: [objectbox, architecture, database, lifecycle]
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.1'

dependencies:
  dartitect:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect
      tag_pattern: 'v{{version}}'
    version: 1.0.0
  dartitect_flutter:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_flutter
      tag_pattern: 'v{{version}}'
    version: 1.0.0
  dartitect_observability:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_observability
      tag_pattern: 'v{{version}}'
    version: 1.0.0
  dartitect_sync:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_sync
      tag_pattern: 'v{{version}}'
    version: 1.0.0
  flutter:
    sdk: flutter
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
