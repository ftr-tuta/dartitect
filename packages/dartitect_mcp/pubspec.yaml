name: dartitect_mcp
description: Local MCP server for safe Dartitect project inspection and reviewed changes.
version: 1.0.0
publish_to: none
repository: https://github.com/ftr-tuta/dartitect
issue_tracker: https://github.com/ftr-tuta/dartitect/issues
topics:
  - mcp
  - architecture
  - tooling
  - dart
  - codex
resolution: workspace

environment:
  sdk: ^3.13.0

executables:
  dartitect_mcp: dartitect_mcp

dependencies:
  crypto: ^3.0.7
  dart_mcp: 0.5.2
  dartitect_cli:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_cli
      tag_pattern: 'v{{version}}'
    version: 1.0.0
dev_dependencies:
  stream_channel: ^2.1.4
  test: ^1.26.3
