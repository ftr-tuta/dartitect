name: dartitect_testing
description: Framework-neutral probes, clocks, and contract harnesses for Dartitect consumers.
version: 1.1.0-rc.1
publish_to: none
repository: https://github.com/ftr-tuta/dartitect
issue_tracker: https://github.com/ftr-tuta/dartitect/issues
topics: [testing, architecture, lifecycle, observability]
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  dartitect:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.1
  dartitect_isolates:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_isolates
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.1
  dartitect_jobs:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_jobs
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.1
  dartitect_modeling:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_modeling
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.1
  dartitect_observability:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_observability
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.1
  dartitect_resilience:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_resilience
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.1
  dartitect_sync:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_sync
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.1
  dartitect_transfer:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_transfer
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.1
dev_dependencies:
  test: ^1.26.3
