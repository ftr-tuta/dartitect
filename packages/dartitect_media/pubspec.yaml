name: dartitect_media
description: Explicit Android and iOS gallery permission and image-save boundary with typed failures for Flutter.
version: 1.0.0-rc.2
repository: https://github.com/ftr-tuta/dartitect
issue_tracker: https://github.com/ftr-tuta/dartitect/issues
topics: [gallery, media, android, ios, flutter]
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.1"

dependencies:
  dartitect: '>=1.0.0-rc.2 <1.0.0'
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.dartitect.media
        pluginClass: DartitectMediaPlugin
      ios:
        pluginClass: DartitectMediaPlugin
