name: dartitect_drift
description: Consumer-owned Drift lifecycle, transaction, and sync integration for Dartitect.
version: 1.1.0
publish_to: none
repository: https://github.com/ftr-tuta/dartitect
issue_tracker: https://github.com/ftr-tuta/dartitect/issues
topics: [drift, architecture, database, sync]
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  dartitect:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_observability:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_observability
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_sync:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_sync
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  drift: ^2.34.3

dev_dependencies:
  build_runner: ^2.10.5
  drift_dev: ^2.34.3
  test: 1.31.1
