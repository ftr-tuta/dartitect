name: dartitect_modeling_analyzer
description: Shared read-only semantic compiler for Dartitect modeling tools and analyzer integrations.
version: 1.1.0
publish_to: none
repository: https://github.com/ftr-tuta/dartitect
issue_tracker: https://github.com/ftr-tuta/dartitect/issues
topics: [analyzer, code-generation, modeling, diagnostics]
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  analyzer: ^13.3.0
  dartitect_modeling:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_modeling
      tag_pattern: 'v{{version}}'
    version: 1.1.0
dev_dependencies:
  test: ^1.26.3
