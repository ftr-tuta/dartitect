name: dartitect_dio
description: Optional explicit ownership and observability integration for Dio.
version: 1.0.0
publish_to: none
repository: https://github.com/ftr-tuta/dartitect
issue_tracker: https://github.com/ftr-tuta/dartitect/issues
topics: [dio, architecture, observability, http]
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  dartitect:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect
      tag_pattern: 'v{{version}}'
    version: 1.0.0
  dartitect_observability:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_observability
      tag_pattern: 'v{{version}}'
    version: 1.0.0
  dartitect_transfer:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_transfer
      tag_pattern: 'v{{version}}'
    version: 1.0.0
  dio: ^5.11.0

dev_dependencies:
  test: ^1.26.3
