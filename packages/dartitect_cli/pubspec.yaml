name: dartitect_cli
description: Semantic architecture scanner, diagnostics, and safe generators for Dartitect projects.
version: 1.0.0-rc.8
repository: https://github.com/ftr-tuta/dartitect
issue_tracker: https://github.com/ftr-tuta/dartitect/issues
topics: [cli, architecture, code-generation, codex]
resolution: workspace

environment:
  sdk: ^3.13.0

executables:
  dartitect: dartitect

dependencies:
  analyzer: ^13.3.0
  crypto: ^3.0.7
  dartitect: '>=1.0.0-rc.8 <1.0.0'
  dartitect_modeling_analyzer: '>=1.0.0-rc.8 <1.0.0'
  dart_style: ^3.1.3
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.26.3
