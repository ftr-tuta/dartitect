name: dartitect_adapters_app
description: Isolated packaged proof for Dio, ObjectBox, media, privacy, and Sentry adapters.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.1'

dependencies:
  dartitect: 1.1.0-rc.2
  dartitect_dio: 1.1.0-rc.2
  dartitect_flutter: 1.1.0-rc.2
  dartitect_media: 1.1.0-rc.2
  dartitect_objectbox: 1.1.0-rc.2
  dartitect_observability: 1.1.0-rc.2
  dartitect_privacy: 1.1.0-rc.2
  dartitect_sentry: 1.1.0-rc.2
  dio: ^5.11.0
  flutter:
    sdk: flutter
  sentry: ^9.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter
