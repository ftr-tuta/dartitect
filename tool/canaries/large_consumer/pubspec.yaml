name: large_consumer_canary
description: Isolated 30-feature scale canary for concrete generated graphs.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.1'

dependencies:
  dartitect: 1.0.0-rc.10
  dartitect_dio: 1.0.0-rc.10
  dartitect_drift: 1.0.0-rc.10
  dartitect_flutter: 1.0.0-rc.10
  dartitect_observability: 1.0.0-rc.10
  dartitect_sync: 1.0.0-rc.10
  dartitect_workmanager: 1.0.0-rc.10
  flutter:
    sdk: flutter

dev_dependencies:
  dartitect_cli: 1.0.0-rc.10
  dartitect_testing: 1.0.0-rc.10
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
