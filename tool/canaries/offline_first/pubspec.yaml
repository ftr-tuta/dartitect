name: dartitect_reference_app
description: Isolated offline-first consumer of the packaged Dartitect cohort.
version: 0.0.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.1'

dependencies:
  dartitect: 1.1.0-rc.2
  dartitect_dio: 1.1.0-rc.2
  dartitect_drift: 1.1.0-rc.2
  dartitect_flutter: 1.1.0-rc.2
  dartitect_isolates: 1.1.0-rc.2
  dartitect_objectbox: 1.1.0-rc.2
  dartitect_observability: 1.1.0-rc.2
  dartitect_sync: 1.1.0-rc.2
  dio: 5.11.0
  drift: 2.34.3
  flutter:
    sdk: flutter
  objectbox: 5.3.2
  objectbox_flutter_libs: 5.3.2

dev_dependencies:
  build_runner: 2.16.0
  dartitect_testing: 1.1.0-rc.2
  drift_dev: 2.34.3
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
