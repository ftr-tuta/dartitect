name: large_consumer_canary
description: Workspace source for the isolated 30-feature scale canary.
version: 1.1.0
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dartitect:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_dio:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_dio
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_drift:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_drift
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_flutter:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_flutter
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_observability:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_observability
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_sync:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_sync
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_workmanager:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_workmanager
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  dartitect_cli:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_cli
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_testing:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_testing
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
