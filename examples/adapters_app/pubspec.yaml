name: dartitect_adapters_app
description: Dartitect optional adapters integration example; ObjectBox excludes web.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.1'

dependencies:
  dartitect:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect
      tag_pattern: 'v{{version}}'
    version: 1.2.0
  dartitect_dio:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_dio
      tag_pattern: 'v{{version}}'
    version: 1.2.0
  dartitect_flutter:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_flutter
      tag_pattern: 'v{{version}}'
    version: 1.2.0
  dartitect_media:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_media
      tag_pattern: 'v{{version}}'
    version: 1.2.0
  dartitect_objectbox:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_objectbox
      tag_pattern: 'v{{version}}'
    version: 1.2.0
  dartitect_observability:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_observability
      tag_pattern: 'v{{version}}'
    version: 1.2.0
  dartitect_privacy:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_privacy
      tag_pattern: 'v{{version}}'
    version: 1.2.0
  dartitect_sentry:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_sentry
      tag_pattern: 'v{{version}}'
    version: 1.2.0
  dio: ^5.11.0
  flutter:
    sdk: flutter
  sentry: ^9.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
