name: dartitect_reference_app
description: Executable native-first Dartitect reference application.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.1'

dependencies:
  dartitect: ^1.0.0-rc.10
  dartitect_dio: ^1.0.0-rc.10
  dartitect_drift: ^1.0.0-rc.10
  dartitect_flutter: ^1.0.0-rc.10
  dartitect_isolates: ^1.0.0-rc.10
  dartitect_objectbox: ^1.0.0-rc.10
  dartitect_observability: ^1.0.0-rc.10
  dartitect_sync: ^1.0.0-rc.10
  dio: 5.11.0
  drift: 2.34.3
  flutter:
    sdk: flutter
  objectbox: 5.3.2
  objectbox_flutter_libs: 5.3.2

dev_dependencies:
  build_runner: 2.16.0
  dartitect_testing: ^1.0.0-rc.10
  drift_dev: 2.34.3
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
