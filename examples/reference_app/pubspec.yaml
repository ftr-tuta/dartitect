name: dartitect_reference_app
description: Executable native-first Dartitect reference application.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.1'

dependencies:
  dartitect:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_dio:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_dio
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_drift:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_drift
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_flutter:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_flutter
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_isolates:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_isolates
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_objectbox:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_objectbox
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_observability:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_observability
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_sync:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_sync
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dio: 5.11.0
  drift: 2.34.3
  flutter:
    sdk: flutter
  objectbox: 5.3.2
  objectbox_flutter_libs: 5.3.2

dev_dependencies:
  build_runner: 2.16.0
  dartitect_flutter_testing:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_flutter_testing
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  dartitect_testing:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_testing
      tag_pattern: 'v{{version}}'
    version: 1.1.0
  drift_dev: 2.34.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
