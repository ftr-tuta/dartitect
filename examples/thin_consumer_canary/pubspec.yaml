name: thin_consumer_canary
description: Thin offline-hybrid canary using every stable opt-in capability.
version: 1.1.0-rc.1
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dartitect:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.1
  dartitect_dio:
    git:
      url: https://github.com/ftr-tuta/dartitect.git
      path: packages/dartitect_dio
      tag_pattern: 'v{{version}}'
    version: 1.1.0-rc.1
  dartitect_drift:
