name: Security

on:
  workflow_dispatch:
  schedule:
    - cron: "12 12 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  osv-trusted:
    name: OSV / scheduled and diagnostic
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
    with:
      scan-args: |-
        --include-git-root
        --config=./osv-scanner.toml
        -r
        ./
      fail-on-vuln: true
      upload-sarif: true
      runs-on: ubuntu-24.04
