name: Security

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "12 12 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  osv-merge-candidate:
    name: OSV / merge candidate
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan full repository and fail on vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.5.1
        with:
          scan-args: |-
            --include-git-root
            --config=./osv-scanner.toml
            -r
            ./

  osv-trusted:
    name: OSV / main, manual and weekly
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@ffa0a5f39214d80778c9b494822d94d0d9668458 # v2.5.1
    with:
      scan-args: |-
        --include-git-root
        --config=./osv-scanner.toml
        -r
        ./
      fail-on-vuln: true
      upload-sarif: true
      runs-on: ubuntu-24.04
