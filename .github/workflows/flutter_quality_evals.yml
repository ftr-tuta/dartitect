name: Flutter Quality Evals

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact Dartitect commit SHA to evaluate
        required: true
        type: string
      model:
        description: Exact Codex model identifier
        required: true
        type: string
      suite:
        description: Required gate or three-repetition trend comparison
        required: true
        default: required
        type: choice
        options:
          - required
          - trend

permissions:
  contents: read
  checks: write

concurrency:
  group: flutter-quality-evals-${{ inputs.sha }}-${{ inputs.model }}-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Flutter Quality Evals / Dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: flutter-quality-evals
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Validate the exact candidate identity
        working-directory: source
        env:
          DARTITECT_REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$DARTITECT_REQUESTED_SHA" ]]; then
            echo "Requested SHA does not match the checked-out candidate." >&2
            exit 1
          fi
      - name: Check out pinned Flutter evals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/evals
          ref: 739c590ad0e028b1393a8604574463e287e5078e
          path: flutter-evals
          persist-credentials: false
      - name: Check out pinned official Flutter plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/agent-plugins
          ref: df9bebe7ec3c96f80f499e5d62ba1ebe81892500
          path: flutter-agent-plugins
          persist-credentials: false
      - name: Install Flutter 3.47.1
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Resolve the candidate workspace
        working-directory: source
        run: flutter pub get
      - name: Validate pinned agent evaluation contracts
        working-directory: source
        run: dart run tool/check_agent_evals.dart
      - name: Run the selected evaluation matrix
        id: evaluate
        working-directory: source
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DARTITECT_CODEX_EVAL_IMAGE: ${{ vars.CODEX_EVAL_IMAGE }}
        run: >-
          dart run tool/agent_evals/run.dart
          --execute
          --sha=${{ inputs.sha }}
          --model=${{ inputs.model }}
          --suite=${{ inputs.suite }}
          --flutter-evals=../flutter-evals
          --official-plugin=../flutter-agent-plugins
          --receipt=${{ runner.temp }}/flutter-quality-eval-receipt.json
      - name: Upload payload-free evaluation receipt
        if: always() && steps.evaluate.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flutter-quality-eval-receipt-${{ inputs.suite }}-${{ inputs.sha }}
          path: ${{ runner.temp }}/flutter-quality-eval-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish the exact-SHA required check
        if: always() && inputs.suite == 'required'
        env:
          GH_TOKEN: ${{ github.token }}
          DARTITECT_EVAL_OUTCOME: ${{ steps.evaluate.outcome }}
          DARTITECT_MODEL: ${{ inputs.model }}
          DARTITECT_SHA: ${{ inputs.sha }}
        run: |
          conclusion=failure
          if [[ "$DARTITECT_EVAL_OUTCOME" == "success" ]]; then
            conclusion=success
          fi
          jq -n \
            --arg name "Flutter Quality Evals / Required" \
            --arg sha "$DARTITECT_SHA" \
            --arg conclusion "$conclusion" \
            --arg model "$DARTITECT_MODEL" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              name: $name,
              head_sha: $sha,
              status: "completed",
              conclusion: $conclusion,
              details_url: $run_url,
              output: {
                title: $name,
                summary: ("Payload-free Flutter quality evaluation completed with model " + $model + ".")
              }
            }' |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input -
