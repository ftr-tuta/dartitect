name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: "3.47.1"
            label: Flutter 3.47.1 (floor)
          - flutter: stable
            label: Flutter stable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Install Flutter 3.47.1 floor
        if: matrix.flutter == '3.47.1'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - name: Install current stable Flutter
        if: matrix.flutter == 'stable'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Resolve isolated benchmark comparators
        run: flutter pub get
        working-directory: tool/benchmark_workspace
      - name: Validate benchmark harness and lifecycle matrix
        run: flutter test
        working-directory: tool/benchmark_workspace
      - name: Reproduce full competitive benchmark matrix
        if: matrix.flutter == '3.47.1'
        run: dart run bin/orchestrate_benchmarks.dart
        working-directory: tool/benchmark_workspace
        env:
          DARTITECT_BENCHMARK_ARTIFACTS: ${{ runner.temp }}/dartitect-benchmark
      - name: Install verified ObjectBox native library
        run: dart run tool/setup_objectbox_vm.dart
      - name: Verify workspace with native ObjectBox
        run: dart run tool/verify.dart --skip-get --native-objectbox
      - name: Audit release artifacts and package dry-runs
        if: matrix.flutter == '3.47.1'
        env:
          AUTHOR_REVISION: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          arguments=(--docs --publish-dry-run)
          if [[ -n "$AUTHOR_REVISION" ]]; then
            arguments+=("--author-revision=$AUTHOR_REVISION")
          elif [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            arguments+=(--exclude-merge-commits)
          fi
          dart run tool/release_audit.dart "${arguments[@]}"
      - name: Validate generated projects and builds
        if: matrix.flutter == '3.47.1'
        run: dart run tool/generated_project_matrix.dart --builds
      - name: Build reference app for Web
        run: flutter build web
        working-directory: examples/reference_app
      - name: Build reference app for Linux
        run: flutter build linux
        working-directory: examples/reference_app
      - name: Build reference app APK
        run: flutter build apk --debug
        working-directory: examples/reference_app
      - name: Build adapters app for Web
        run: flutter build web
        working-directory: examples/adapters_app
      - name: Build adapters app for Linux
        run: flutter build linux
        working-directory: examples/adapters_app
      - name: Build adapters app APK
        run: flutter build apk --debug
        working-directory: examples/adapters_app
      - name: Produce Android API 24 build evidence without an emulator
        if: matrix.flutter == '3.47.1'
        run: >-
          dart run tool/run_native_ci_evidence.dart
          --cell=android-media-floor-build
      - name: Upload Android floor evidence receipt
        if: matrix.flutter == '3.47.1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-evidence-android-floor-${{ github.sha }}
          path: build/native-evidence/android-media-floor-build-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .

  windows:
    name: Windows / Flutter 3.47.1
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Resolve isolated benchmark comparators
        run: flutter pub get
        working-directory: tool/benchmark_workspace
      - name: Validate benchmark harness and lifecycle matrix
        run: flutter test
        working-directory: tool/benchmark_workspace
      - name: Install verified ObjectBox native library
        run: dart run tool/setup_objectbox_vm.dart
      - name: Verify workspace with native ObjectBox
        run: dart run tool/verify.dart --skip-get --native-objectbox
      - name: Build reference app for Windows
        run: flutter build windows
        working-directory: examples/reference_app
      - name: Build adapters app for Windows
        run: flutter build windows
        working-directory: examples/adapters_app
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .

  macos:
    name: macOS and iOS / Flutter 3.47.1
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Resolve isolated benchmark comparators
        run: flutter pub get
        working-directory: tool/benchmark_workspace
      - name: Validate benchmark harness and lifecycle matrix
        run: flutter test
        working-directory: tool/benchmark_workspace
      - name: Remove Flutter-generated Podfiles before native evidence
        run: >-
          rm -f
          examples/reference_app/ios/Podfile
          examples/reference_app/macos/Podfile
          examples/adapters_app/ios/Podfile
          examples/adapters_app/macos/Podfile
      - name: Select an installed iOS simulator dynamically
        id: ios-simulator
        shell: bash
        run: |
          ios_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          ios_runtime="com.apple.CoreSimulator.SimRuntime.iOS-${ios_sdk//./-}"
          selected="$(
            xcrun simctl list devices available --json |
              jq -r --arg runtime "$ios_runtime" '
                [
                  .devices
                  | to_entries[]
                  | select(.key == $runtime)
                  | .value[]
                  | select(.isAvailable == true and (.name | startswith("iPhone")))
                  | {name: .name, udid: .udid}
                ]
                | sort_by(.name)
                | last
                | [.udid, .name]
                | @tsv
              '
          )"
          if [[ -z "$selected" || "$selected" == "null" ]]; then
            echo "No installed, available iOS simulator matches the active iOS SDK." >&2
            exit 1
          fi
          IFS=$'\t' read -r simulator_id simulator_model <<<"$selected"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >>"$GITHUB_OUTPUT"
          echo "model=$simulator_model" >>"$GITHUB_OUTPUT"
          echo "os=$ios_sdk" >>"$GITHUB_OUTPUT"
      - name: Install pinned Photos permission utility
        shell: bash
        env:
          APPLESIMUTILS_VERSION: "0.9.12"
          APPLESIMUTILS_SHA256: "3373d85ea6051e77865b0a22960eb0b5d63f3126c7c99232d0b6b9c83ee2c133"
        run: |
          archive="${RUNNER_TEMP:?}/applesimutils-${APPLESIMUTILS_VERSION}.tar.gz"
          install_root="${RUNNER_TEMP:?}/applesimutils-install"
          curl --fail --location --silent --show-error \
            "https://github.com/wix/AppleSimulatorUtils/releases/download/${APPLESIMUTILS_VERSION}/applesimutils-${APPLESIMUTILS_VERSION}.big_sur.bottle.tar.gz" \
            --output "$archive"
          actual_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$APPLESIMUTILS_SHA256" ]]; then
            echo "AppleSimulatorUtils checksum mismatch." >&2
            exit 1
          fi
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          tool_path="$install_root/applesimutils/${APPLESIMUTILS_VERSION}/bin/applesimutils"
          tool_version="$("$tool_path" --version)"
          if [[ "$tool_version" != "applesimutils version ${APPLESIMUTILS_VERSION}" ]]; then
            echo "Unexpected AppleSimulatorUtils version." >&2
            exit 1
          fi
          echo "DARTITECT_APPLESIMUTILS=$tool_path" >>"$GITHUB_ENV"
      - name: Produce iOS media floor build evidence
        run: >-
          dart run tool/run_native_ci_evidence.dart
          --cell=ios-media-floor-build
      - name: Produce iOS privacy floor build evidence
        run: >-
          dart run tool/run_native_ci_evidence.dart
          --cell=ios-privacy-floor-build
      - name: Exercise Photos and ATT on the installed simulator
        env:
          DARTITECT_IOS_SIMULATOR_ID: ${{ steps.ios-simulator.outputs.id }}
          DARTITECT_IOS_SIMULATOR_MODEL: ${{ steps.ios-simulator.outputs.model }}
          DARTITECT_IOS_SIMULATOR_OS: ${{ steps.ios-simulator.outputs.os }}
        run: >-
          dart run tool/run_native_ci_evidence.dart
          --cell=ios-current-simulator
      - name: Upload iOS native evidence receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-evidence-ios-${{ github.sha }}
          path: |
            build/native-evidence/ios-media-floor-build-${{ github.sha }}.json
            build/native-evidence/ios-privacy-floor-build-${{ github.sha }}.json
            build/native-evidence/ios-current-simulator-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Install verified ObjectBox native library
        run: dart run tool/setup_objectbox_vm.dart
      - name: Verify workspace with native ObjectBox
        run: dart run tool/verify.dart --skip-get --native-objectbox
      - name: Build reference app for macOS
        shell: bash
        run: |
          set -o pipefail
          build_log="${RUNNER_TEMP:?}/reference-macos-build.log"
          for attempt in 1 2 3; do
            if flutter build macos 2>&1 | tee "$build_log"; then
              exit 0
            fi
            if ! grep -Eq \
              'Response: 429|rate-limited due to too many requests' \
              "$build_log"; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep_seconds=$((attempt * 20))
            echo "CocoaPods was rate-limited; retrying in ${sleep_seconds}s."
            sleep "$sleep_seconds"
          done
        working-directory: examples/reference_app
      - name: Compile and link reference app for iOS without signing
        run: flutter build ios --no-codesign
        working-directory: examples/reference_app
      - name: Build adapters app for macOS
        run: flutter build macos
        working-directory: examples/adapters_app
      - name: Compile and link adapters app for iOS without signing
        run: flutter build ios --no-codesign
        working-directory: examples/adapters_app
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .

  clean-clone:
    name: Clean clone / release audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Audit a disposable exact-HEAD clone
        run: dart run tool/run_clean_clone_release_audit.dart
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .

  git-consumption:
    name: Git consumption / v1.0.0-rc.3
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Install verified ObjectBox native library
        run: dart run tool/setup_objectbox_vm.dart
      - name: Materialize disposable annotated-tag remote
        run: |
          git config user.name ftr
          git config user.email ftr@tuta.com
          git tag --delete v1.0.0-rc.3 2>/dev/null || true
          git tag --annotate v1.0.0-rc.3 --message "Dartitect 1.0.0-rc.3 Git candidate"
          git clone --bare . "${RUNNER_TEMP:?}/dartitect.git"
      - name: Validate all consumers through Git only
        run: >-
          dart run tool/run_git_canaries.dart
          --repository=file://${RUNNER_TEMP:?}/dartitect.git
          --ref=v1.0.0-rc.3
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .
