name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - flutter: "3.47.1"
            label: Flutter 3.47.1 (floor)
          - flutter: stable
            label: Flutter stable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
      - name: Install Flutter 3.47.1 floor
        if: matrix.flutter == '3.47.1'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - name: Install current stable Flutter
        if: matrix.flutter == 'stable'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Validate Workmanager callback contracts
        run: flutter test packages/dartitect_workmanager
      - name: Resolve isolated benchmark comparators
        run: flutter pub get
        working-directory: tool/benchmark_workspace
      - name: Resolve isolated DevTools extension
        run: flutter pub get
        working-directory: tool/dartitect_devtools_extension
      - name: Validate benchmark harness and lifecycle matrix
        run: flutter test
        working-directory: tool/benchmark_workspace
      - name: Reproduce full competitive benchmark matrix
        if: matrix.flutter == '3.47.1'
        run: dart run bin/orchestrate_benchmarks.dart
        working-directory: tool/benchmark_workspace
        env:
          DARTITECT_BENCHMARK_ARTIFACTS: ${{ runner.temp }}/dartitect-benchmark
      - name: Install verified ObjectBox native library
        run: dart run tool/setup_objectbox_vm.dart
      - name: Exercise Drift background executor and persistence
        run: dart run tool/run_drift_native_fixture.dart
      - name: Exercise ObjectBox and Drift coexistence
        if: matrix.flutter == '3.47.1'
        run: flutter test tool/objectbox_native_fixture
      - name: Validate executable Flutter quality contracts
        if: matrix.flutter == '3.47.1'
        run: |
          dart run tool/check_ui_quality.dart
          dart run tool/check_flutter_quality_performance.dart
      - name: Verify workspace with native ObjectBox
        run: dart run tool/verify.dart --skip-get --native-objectbox
      - name: Reproduce the 12-scenario change-tax study
        if: matrix.flutter == '3.47.1'
        env:
          DARTITECT_CI_RUNNER_ID: ubuntu-24.04-flutter-3.47.1
        run: >-
          dart run tool/change_tax.dart
          --output=build/change-tax/report.json
      - name: Upload change-tax evidence
        if: matrix.flutter == '3.47.1' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: change-tax-${{ github.run_attempt }}
          path: build/change-tax/report.json
          if-no-files-found: error
          retention-days: 30
      - name: Audit GitHub-only release artifacts
        if: matrix.flutter == '3.47.1'
        env:
          AUTHOR_REVISION: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          arguments=(--docs)
          if [[ -n "$AUTHOR_REVISION" ]]; then
            arguments+=("--author-revision=$AUTHOR_REVISION")
          elif [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            arguments+=(--exclude-merge-commits)
          fi
          dart run tool/release_audit.dart "${arguments[@]}"
      - name: Validate generated projects and builds
        if: matrix.flutter == '3.47.1'
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.file://${{ runner.temp }}/dartitect-generated-projects.git.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/ftr-tuta/dartitect.git
        run: |
          git config user.name ftr
          git config user.email ftr@tuta.com
          candidate_tag="$(jq -r '.workspaceCohort.derivedTag' tool/package_release_contract.json)"
          workspace_version="$(jq -r '.workspaceCohort.version' tool/package_release_contract.json)"
          git tag --delete "$candidate_tag" 2>/dev/null || true
          git tag --annotate "$candidate_tag" --message "Dartitect ${workspace_version} generated-project canary"
          git clone --bare . "${RUNNER_TEMP:?}/dartitect-generated-projects.git"
          dart run tool/generated_project_matrix.dart --builds
      - name: Verify pinned shared UI goldens
        if: matrix.flutter == '3.47.1'
        run: flutter test examples/paved_road_canary/test/shared_layout_golden_test.dart
      - name: Compile and discover Flutter widget previews in a disposable copy
        run: dart run tool/check_flutter_previews.dart
      - name: Exercise the paved-road Flutter quality journey
        if: matrix.flutter == '3.47.1'
        run: xvfb-run --auto-servernum flutter test -d linux integration_test/flutter_quality_journey_test.dart
        working-directory: examples/paved_road_canary
      - name: Exercise the reference-app Flutter quality journey
        if: matrix.flutter == '3.47.1'
        run: xvfb-run --auto-servernum flutter test -d linux integration_test/flutter_quality_journey_test.dart
        working-directory: examples/reference_app
      - name: Build reference app for Web
        run: flutter build web
        working-directory: examples/reference_app
      - name: Build reference app for Linux
        run: flutter build linux
        working-directory: examples/reference_app
      - name: Build reference app APK
        run: flutter build apk --debug
        working-directory: examples/reference_app
      - name: Build adapters app for Web
        run: flutter build web
        working-directory: examples/adapters_app
      - name: Build adapters app for Linux
        run: flutter build linux
        working-directory: examples/adapters_app
      - name: Build adapters app APK
        run: flutter build apk --debug
        working-directory: examples/adapters_app
      - name: Build UI canary for Web
        run: flutter build web --release
        working-directory: examples/paved_road_canary
      - name: Build UI canary for Linux
        run: flutter build linux --release
        working-directory: examples/paved_road_canary
      - name: Build UI canary APK
        run: flutter build apk --debug
        working-directory: examples/paved_road_canary
      - name: Produce Android API 24 build evidence without an emulator
        if: matrix.flutter == '3.47.1'
        run: >-
          dart run tool/run_native_ci_evidence.dart
          --cell=android-media-floor-build
      - name: Upload Android floor evidence manifest
        if: matrix.flutter == '3.47.1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-evidence-android-floor
          path: build/native-evidence/android-media-floor-build-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .

  windows:
    name: Windows / Flutter 3.47.1
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Resolve isolated benchmark comparators
        run: flutter pub get
        working-directory: tool/benchmark_workspace
      - name: Resolve isolated DevTools extension
        run: flutter pub get
        working-directory: tool/dartitect_devtools_extension
      - name: Validate benchmark harness and lifecycle matrix
        run: flutter test
        working-directory: tool/benchmark_workspace
      - name: Install verified ObjectBox native library
        run: dart run tool/setup_objectbox_vm.dart
      - name: Exercise Drift background executor and persistence
        run: dart run tool/run_drift_native_fixture.dart
      - name: Verify workspace with native ObjectBox
        run: dart run tool/verify.dart --skip-get --native-objectbox
      - name: Build reference app for Windows
        run: flutter build windows
        working-directory: examples/reference_app
      - name: Build adapters app for Windows
        run: flutter build windows
        working-directory: examples/adapters_app
      - name: Build UI canary for Windows
        run: flutter build windows --release
        working-directory: examples/paved_road_canary
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .

  android-emulator:
    name: Android API 34 / hosted emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      DARTITECT_ANDROID_AVD: dartitect-api-34
      DARTITECT_ANDROID_SYSTEM_IMAGE: system-images;android-34;google_apis;x86_64
      DARTITECT_ANDROID_EMULATOR_ID: emulator-5554
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Expose preinstalled Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$android_sdk_root" ]]; then
            echo "The hosted runner did not expose an Android SDK root." >&2
            exit 1
          fi
          for tool_directory in \
            "$android_sdk_root/cmdline-tools/latest/bin" \
            "$android_sdk_root/platform-tools"; do
            if [[ ! -d "$tool_directory" ]]; then
              echo "Missing hosted Android tool directory: $tool_directory" >&2
              exit 1
            fi
            echo "$tool_directory" >>"$GITHUB_PATH"
          done
          echo "$android_sdk_root/emulator" >>"$GITHUB_PATH"
      - name: Resolve workspace
        run: flutter pub get
      - name: Install the pinned API 34 Google APIs image
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-34" \
            "${DARTITECT_ANDROID_SYSTEM_IMAGE}"
          test -x "${ANDROID_SDK_ROOT:?}/emulator/emulator"
          sudo chmod 666 /dev/kvm
      - name: Validate Workmanager callback contracts before device execution
        run: flutter test packages/dartitect_workmanager
      - name: Create and boot a clean API 34 AVD
        id: avd
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_root="${RUNNER_TEMP:?}/android-emulator-diagnostics"
          export ANDROID_AVD_HOME="${RUNNER_TEMP:?}/android-avd"
          mkdir -p "$diagnostic_root"
          mkdir -p "$ANDROID_AVD_HOME"
          booted=false
          for attempt in 1 2; do
            adb kill-server || true
            avdmanager delete avd --name "$DARTITECT_ANDROID_AVD" || true
            echo no | avdmanager create avd \
              --force \
              --name "$DARTITECT_ANDROID_AVD" \
              --package "$DARTITECT_ANDROID_SYSTEM_IMAGE" \
              -d pixel_6
            emulator -list-avds >"$diagnostic_root/avds-attempt-${attempt}.txt"
            if ! grep -qx "$DARTITECT_ANDROID_AVD" \
              "$diagnostic_root/avds-attempt-${attempt}.txt"; then
              echo "The newly created AVD is not visible to the emulator." >&2
              find "$ANDROID_AVD_HOME" -maxdepth 2 -type f -print >&2
              exit 1
            fi
            nohup emulator "@${DARTITECT_ANDROID_AVD}" \
              -port 5554 \
              -no-window \
              -no-audio \
              -no-boot-anim \
              -gpu swiftshader_indirect \
              -wipe-data \
              -no-snapshot \
              >"$diagnostic_root/emulator-attempt-${attempt}.log" 2>&1 &
            emulator_pid=$!
            export DARTITECT_EMULATOR_PID="$emulator_pid"
            if timeout 360 bash -c '
              until adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | grep -qx 1; do
                kill -0 "$DARTITECT_EMULATOR_PID" 2>/dev/null || exit 1
                sleep 2
              done
            '; then
              booted=true
              echo "boot_attempt=$attempt" >>"$GITHUB_OUTPUT"
              break
            fi
            adb -s emulator-5554 emu kill || kill "$emulator_pid" || true
            wait "$emulator_pid" || true
            if [[ "$attempt" -eq 1 ]]; then
              echo "Hosted emulator infrastructure failed; recreating the complete AVD once."
            fi
          done
          if [[ "$booted" != true ]]; then
            echo "API 34 AVD did not boot after one infrastructure retry." >&2
            exit 1
          fi
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
      - name: Exercise Android lifecycle, media, invalid files, and cleanup
        run: >-
          dart run tool/run_native_ci_evidence.dart
          --cell=android-media-current-emulator
      - name: Upload Android emulator evidence manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-evidence-android-emulator
          path: build/native-evidence/android-media-current-emulator-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-emulator-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .

  macos:
    name: macOS and iOS / Flutter 3.47.1
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Resolve isolated benchmark comparators
        run: flutter pub get
        working-directory: tool/benchmark_workspace
      - name: Resolve isolated DevTools extension
        run: flutter pub get
        working-directory: tool/dartitect_devtools_extension
      - name: Validate benchmark harness and lifecycle matrix
        run: flutter test
        working-directory: tool/benchmark_workspace
      - name: Remove Flutter-generated Podfiles before native evidence
        run: >-
          rm -f
          examples/reference_app/ios/Podfile
          examples/reference_app/macos/Podfile
          examples/adapters_app/ios/Podfile
          examples/adapters_app/macos/Podfile
      - name: Select an installed iOS simulator dynamically
        id: ios-simulator
        shell: bash
        run: |
          ios_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          ios_runtime="com.apple.CoreSimulator.SimRuntime.iOS-${ios_sdk//./-}"
          selected="$(
            xcrun simctl list devices available --json |
              jq -r --arg runtime "$ios_runtime" '
                [
                  .devices
                  | to_entries[]
                  | select(.key == $runtime)
                  | .value[]
                  | select(.isAvailable == true and (.name | startswith("iPhone")))
                  | {name: .name, udid: .udid}
                ]
                | sort_by(.name)
                | last
                | [.udid, .name]
                | @tsv
              '
          )"
          if [[ -z "$selected" || "$selected" == "null" ]]; then
            echo "No installed, available iOS simulator matches the active iOS SDK." >&2
            exit 1
          fi
          IFS=$'\t' read -r simulator_id simulator_model <<<"$selected"
          xcrun simctl boot "$simulator_id" 2>/dev/null || true
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >>"$GITHUB_OUTPUT"
          echo "model=$simulator_model" >>"$GITHUB_OUTPUT"
          echo "os=$ios_sdk" >>"$GITHUB_OUTPUT"
      - name: Install pinned Photos permission utility
        shell: bash
        env:
          APPLESIMUTILS_VERSION: "0.9.12"
          APPLESIMUTILS_SHA256: "3373d85ea6051e77865b0a22960eb0b5d63f3126c7c99232d0b6b9c83ee2c133"
        run: |
          archive="${RUNNER_TEMP:?}/applesimutils-${APPLESIMUTILS_VERSION}.tar.gz"
          install_root="${RUNNER_TEMP:?}/applesimutils-install"
          curl --fail --location --silent --show-error \
            "https://github.com/wix/AppleSimulatorUtils/releases/download/${APPLESIMUTILS_VERSION}/applesimutils-${APPLESIMUTILS_VERSION}.big_sur.bottle.tar.gz" \
            --output "$archive"
          actual_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$APPLESIMUTILS_SHA256" ]]; then
            echo "AppleSimulatorUtils checksum mismatch." >&2
            exit 1
          fi
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          tool_path="$install_root/applesimutils/${APPLESIMUTILS_VERSION}/bin/applesimutils"
          tool_version="$("$tool_path" --version)"
          if [[ "$tool_version" != "applesimutils version ${APPLESIMUTILS_VERSION}" ]]; then
            echo "Unexpected AppleSimulatorUtils version." >&2
            exit 1
          fi
          echo "DARTITECT_APPLESIMUTILS=$tool_path" >>"$GITHUB_ENV"
      - name: Produce iOS media floor build evidence
        run: >-
          dart run tool/run_native_ci_evidence.dart
          --cell=ios-media-floor-build
      - name: Produce iOS privacy floor build evidence
        run: >-
          dart run tool/run_native_ci_evidence.dart
          --cell=ios-privacy-floor-build
      - name: Exercise Photos and ATT on the installed simulator
        env:
          DARTITECT_IOS_SIMULATOR_ID: ${{ steps.ios-simulator.outputs.id }}
          DARTITECT_IOS_SIMULATOR_MODEL: ${{ steps.ios-simulator.outputs.model }}
          DARTITECT_IOS_SIMULATOR_OS: ${{ steps.ios-simulator.outputs.os }}
        run: >-
          dart run tool/run_native_ci_evidence.dart
          --cell=ios-current-simulator
      - name: Upload iOS native evidence manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-evidence-ios
          path: |
            build/native-evidence/ios-media-floor-build-${{ github.sha }}.json
            build/native-evidence/ios-privacy-floor-build-${{ github.sha }}.json
            build/native-evidence/ios-current-simulator-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Install verified ObjectBox native library
        run: dart run tool/setup_objectbox_vm.dart
      - name: Exercise Drift background executor and persistence
        run: dart run tool/run_drift_native_fixture.dart
      - name: Verify workspace with native ObjectBox
        run: dart run tool/verify.dart --skip-get --native-objectbox
      - name: Build reference app for macOS
        shell: bash
        run: |
          set -o pipefail
          build_log="${RUNNER_TEMP:?}/reference-macos-build.log"
          for attempt in 1 2 3; do
            if flutter build macos 2>&1 | tee "$build_log"; then
              exit 0
            fi
            if ! grep -Eq \
              'Response: 429|rate-limited due to too many requests' \
              "$build_log"; then
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep_seconds=$((attempt * 20))
            echo "CocoaPods was rate-limited; retrying in ${sleep_seconds}s."
            sleep "$sleep_seconds"
          done
        working-directory: examples/reference_app
      - name: Compile and link reference app for iOS without signing
        run: flutter build ios --no-codesign
        working-directory: examples/reference_app
      - name: Build adapters app for macOS
        run: flutter build macos
        working-directory: examples/adapters_app
      - name: Compile and link adapters app for iOS without signing
        run: flutter build ios --no-codesign
        working-directory: examples/adapters_app
      - name: Build UI canary for macOS
        run: flutter build macos --release
        working-directory: examples/paved_road_canary
      - name: Compile and link UI canary for iOS without signing
        run: flutter build ios --release --no-codesign
        working-directory: examples/paved_road_canary
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .

  drift-web:
    name: Drift Web / Chrome 2.34.3
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Resolve workspace from the lockfile
        run: flutter pub get
      - name: Require hosted Chrome
        run: google-chrome --version
      - name: Exercise portable and isolated Drift Web profiles
        env:
          DARTITECT_DRIFT_WEB_DIAGNOSTICS: ${{ runner.temp }}/drift-web-diagnostics
        run: dart run tool/run_drift_web_fixture.dart
      - name: Exercise modeling and JSON in hosted Chrome
        run: dart test --platform chrome
        working-directory: packages/dartitect_modeling
      - name: Exercise bounded HTTP feedback and shared retry budgets in Chrome
        run: dart test --platform chrome
        working-directory: packages/dartitect_resilience
      - name: Exercise Flutter UI runtime in hosted Chrome
        run: flutter test --platform chrome
        working-directory: packages/dartitect_flutter
      - name: Exercise Flutter UI matrix package in hosted Chrome
        run: flutter test --platform chrome
        working-directory: packages/dartitect_flutter_testing
      - name: Upload Drift Web diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift-web-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/drift-web-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .

  clean-clone:
    name: Clean clone / release audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Audit a disposable exact-HEAD clone
        run: dart run tool/run_clean_clone_release_audit.dart
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .

  git-consumption:
    name: Git consumption / workspace candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Install verified ObjectBox native library
        run: dart run tool/setup_objectbox_vm.dart
      - name: Materialize disposable annotated-tag remote
        run: |
          git config user.name ftr
          git config user.email ftr@tuta.com
          candidate_tag="$(jq -r '.workspaceCohort.derivedTag' tool/package_release_contract.json)"
          workspace_version="$(jq -r '.workspaceCohort.version' tool/package_release_contract.json)"
          git tag --delete "$candidate_tag" 2>/dev/null || true
          git tag --annotate "$candidate_tag" --message "Dartitect ${workspace_version} Git release canary"
          git clone --bare . "${RUNNER_TEMP:?}/dartitect.git"
      - name: Validate all consumers through Git only
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.file://${{ runner.temp }}/dartitect.git.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/ftr-tuta/dartitect.git
        run: >-
          dart run tool/run_git_canaries.dart
          --repository=https://github.com/ftr-tuta/dartitect.git
          --ref="$(jq -r '.workspaceCohort.derivedTag' tool/package_release_contract.json)"
      - name: Validate CLI installation from the release tag
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.file://${{ runner.temp }}/dartitect.git.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/ftr-tuta/dartitect.git
        run: >-
          dart install https://github.com/ftr-tuta/dartitect.git
          --git-path packages/dartitect_cli
          --git-ref "$(jq -r '.workspaceCohort.derivedTag' tool/package_release_contract.json)"
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .

  osv:
    name: OSV / merge candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out merge candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan full repository and fail on vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.5.1
        with:
          scan-args: |-
            --include-git-root
            --config=./osv-scanner.toml
            -r
            ./

  titect-paired:
    name: Titect / Paired conformance and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: titect
          POSTGRES_PASSWORD: titect-fixture-only
          POSTGRES_DB: titect
        ports:
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U titect"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CHROME_EXECUTABLE: /usr/bin/google-chrome
      TITECT_POSTGRES_DSN: postgresql://titect:titect-fixture-only@127.0.0.1:55438/titect
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.4"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.7"
      - name: Resolve pinned consumer and reference dependencies
        run: |
          flutter pub get
          python3 tool/prepare_titect_reference.py build/pytitect-reference
          uv sync --project build/pytitect-reference --frozen --extra fastapi --extra sqlalchemy
          uv sync --project build/pytitect-reference/examples/django_reference --frozen
          google-chrome --version
          dart build cli --root-package dartitect_drift -t tool/titect_fixture/composition/native_actor.dart -o build/titect-native
      - name: Reject deliberate wire and evidence drift
        run: python3 tool/titect_fixture_tools_test.py
      - name: Run paired wire conformance
        id: conformance
        shell: bash
        run: |
          mode=()
          if jq -e '.integrated == false' tool/titect_fixture/pin.json >/dev/null; then
            mode+=(--preliminary)
          fi
          build/pytitect-reference/.venv/bin/python tool/run_titect_conformance.py \
            --python-root build/pytitect-reference --output build/titect-evidence "${mode[@]}"

      - name: Run persistent paired recovery
        if: success() || failure()
        shell: bash
        run: |
          mode=()
          if jq -e '.integrated == false' tool/titect_fixture/pin.json >/dev/null; then
            mode+=(--preliminary)
          fi
          build/pytitect-reference/.venv/bin/python tool/run_titect_recovery.py \
            --python-root build/pytitect-reference \
            --actor build/titect-native/bundle/bin/native_actor \
            --django-python "$GITHUB_WORKSPACE/build/pytitect-reference/examples/django_reference/.venv/bin/python" \
            --output build/titect-evidence "${mode[@]}"

      - name: Require complete final evidence
        if: success() || failure()
        run: dart run tool/check_titect_evidence.dart build/titect-evidence
      - name: Retain paired evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: titect-evidence
          path: build/titect-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .

  required:
    name: CI / Required
    if: always()
    needs:
      - linux
      - windows
      - macos
      - android-emulator
      - drift-web
      - titect-paired
      - clean-clone
      - git-consumption
      - osv
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Resolve workspace
        run: flutter pub get
      - name: Require every coordinated job to succeed
        env:
          DARTITECT_NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          if ! jq -e 'all(.[]; .result == "success")' <<<"$DARTITECT_NEEDS_JSON" >/dev/null; then
            echo "At least one coordinated CI job did not conclude success." >&2
            jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$DARTITECT_NEEDS_JSON" >&2
            exit 1
          fi
      - name: Download current-run native manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-evidence-*
          path: build/native-evidence
          merge-multiple: true
      - name: Validate the exact current-run native matrix
        run: dart run tool/check_native_evidence.dart
      - name: Download current-run paired evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: titect-evidence
          path: build/titect-evidence
      - name: Validate current-run paired evidence
        run: dart run tool/check_titect_evidence.dart build/titect-evidence
      - name: Create the main-only readiness manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DARTITECT_NEEDS_JSON: ${{ toJSON(needs) }}
        run: dart run tool/create_actions_readiness.dart
      - name: Validate formal main readiness
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          dart run tool/check_actions_readiness.dart
          --manifest=build/actions-readiness-v1/actions-readiness-v1.json
      - name: Upload actions-readiness-v1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actions-readiness-v1
          path: build/actions-readiness-v1
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code -- .
