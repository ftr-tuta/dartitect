name: dartitect_workspace
description: Native-first architecture SDK workspace for Dart and Flutter.
version: 1.0.0-rc.8
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/*
  - examples/*

dev_dependencies:
  analyzer: 13.3.0
  build_runner: 2.16.0
  crypto: 3.0.7
  drift: 2.34.3
  drift_dev: 2.34.3
  sqlite3: 3.5.2
  test: 1.31.1
  web: 1.1.1
